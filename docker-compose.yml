services:
  backend:
    build:
      context: ./backend 
      dockerfile: Dockerfile 
    image: pipeline-processing-backend:local
    container_name: pipeline-processing-backend
    ports:
      - "${PORT:-8080}:8080" 
    env_file:
      - path: .env
        required: false
    environment:
      PORT: 8080 
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  db:
    image: postgres:16-alpine
    container_name: pipeline-processing-db
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    env_file:
      - path: .env
        required: false
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-pipeline_processing}
    volumes:
      - postgres_data:/var/lib/postgresql/data 
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-pipeline_processing}"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

volumes:
  postgres_data: